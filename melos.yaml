name: chat_packages

packages:
  - packages/**

scripts:
  analyze:
    description: Analyze all packages
    exec: dart analyze --fatal-infos
  format:
    description: Format check all packages
    exec: dart format --set-exit-if-changed .
  format:fix:
    description: Format all packages
    exec: dart format .
  publish-dry-run:
    description: Publish dry-run all packages
    exec: dart pub publish --dry-run
    packageFilters:
      noPrivate: true

command:
  bootstrap:
    runPubGetInParallel: false
  version:
    hooks:
      # The OHOS module version is not bumped by melos; sync it from pubspec.yaml and stage it into the version commit.
      preCommit: |
        v=$(sed -n 's/^version: *//p' packages/chat_bottom_container/pubspec.yaml)
        f=packages/chat_bottom_container/ohos/oh-package.json5
        perl -pi -e "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" "$f"
        git add "$f"
